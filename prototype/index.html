<title>FinFiles Data Management</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
<style>
/* Layout: AAIS Fundscreener theme (teal #004c4c, yellow #f3c000) on the FinFiles layout — topbar with 3-item navigation, tabs inside each area, white cards on #f3f3f3.
   Single light theme on purpose: the FinFiles UI defines no dark mode. */
:root {
  color-scheme: light;
  --dark-blue: #004c4c; --dark-blue-hover: #001919; --bright-blue: #00a296; --yellow: #f3c000;
  --green: #0c7c2c; --red: #a10000; --orange: #f3c000; --grey: #5c5c5c;
  --white: #FFFFFF; --text: #000000; --page: #f3f3f3; --fill: #e5f6f4; --border: #e2e2e2; --row: #ededed;
  --green-tint: rgba(12,124,44,.12); --red-tint: rgba(161,0,0,.10); --orange-tint: rgba(243,192,0,.25); --blue-tint: rgba(0,76,76,.08);
  --green-text: #0c7c2c; --red-text: #a10000; --orange-text: #6b5400;
  --font: 'ABN AMRO Sans', 'Ubuntu', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
html, body { height: 100%; }
body { background: var(--page); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--bright-blue); outline-offset: 2px; }
.num, .isin, .ts { font-variant-numeric: tabular-nums; }
.isin { letter-spacing: .02em; }
a { color: var(--dark-blue); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--dark-blue); }

.shell { min-height: 100%; display: flex; flex-direction: column; }
/* Topbar */
.topbar { background: var(--dark-blue); color: var(--white); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.topbar .in { max-width: 1248px; margin: 0 auto; min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px;
  padding-block: 8px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.logo { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--white); }
.logo img { height: 28px; width: auto; display: block; }
.logo span { font-size: 13px; opacity: .6; }
.mainnav { display: flex; gap: 4px; align-self: stretch; }
.mainnav a { display: flex; align-items: center; padding: 0 12px; color: rgba(255,255,255,.75); text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; position: relative; }
.mainnav a:hover { color: var(--white); }
.mainnav a.on { color: var(--white); font-weight: 600; border-bottom-color: var(--bright-blue); }
.mainnav .badge { margin-left: 6px; font-size: 11px; font-weight: 600; background: var(--red); color: var(--white); border-radius: 999px; padding: 0 6px; }
.utility { margin-left: auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.knownat { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.knownat label { opacity: .7; }
.knownat select { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.3); color: var(--white); border-radius: 6px; padding: 5px 8px; }
.knownat select option { color: var(--text); }
.clientname { font-size: 13px; opacity: .85; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.15); display: grid; place-items: center; font-size: 12px; font-weight: 600; }

/* Content */
main { flex: 1; width: 100%; max-width: 1248px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 28px; font-weight: 700; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 20px; font-weight: 600; line-height: 1.3; margin: 0; }
h3 { font-size: 16px; font-weight: 600; margin: 0; }
.meta { color: var(--grey); font-size: 12px; }
.lead { color: var(--grey); margin: 6px 0 0; max-width: 72ch; }
.pagehead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; }
.back { font-size: 13px; text-decoration: none; }
.back:hover { text-decoration: underline; }

.card { background: var(--white); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.card > .hd { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px 24px; border-bottom: 1px solid var(--row); }
.card > .bd { padding: 24px; }
.grid { display: grid; gap: 16px; }
.tiles { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.two { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.tile { padding: 20px 24px; display: flex; flex-direction: column; gap: 4px; color: inherit; text-decoration: none; }
.tile .lab { font-size: 12px; color: var(--grey); text-transform: uppercase; letter-spacing: .06em; }
.tile .val { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile.alert { border-left: 3px solid var(--red); }

.notice { padding: 12px 16px; border-radius: 8px; background: var(--orange-tint); border: 1px solid var(--orange); color: var(--text); }

.tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs a, .tabs button { border: 0; background: none; padding: 10px 12px; color: var(--grey); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; cursor: pointer; }
.tabs .on { color: var(--text); border-bottom-color: var(--bright-blue); }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 400; color: var(--grey); text-transform: uppercase; letter-spacing: .05em; padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 13px 16px; border-bottom: 1px solid var(--row); vertical-align: middle; }
td.num, th.num { text-align: right; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--page); }
tr.fundrow td { background: var(--fill); padding-block: 10px; }
tr.removed td { color: var(--grey); }
tr.removed .isin { text-decoration: line-through; }
tr.lineage > td { background: var(--page); padding: 0; }
tr.confirm td { background: var(--red-tint); }
.lin { padding: 16px 16px 16px 32px; display: flex; flex-direction: column; gap: 12px; }
.lin table { background: var(--white); border: 1px solid var(--border); border-radius: 8px; }
.why { color: var(--grey); font-size: 13px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.src { background: var(--fill); color: var(--dark-blue); }
.src-MANUAL { background: var(--white); color: var(--dark-blue); box-shadow: inset 0 0 0 1px var(--dark-blue); }
.src-CLIENT { background: var(--white); color: var(--text); box-shadow: inset 0 0 0 1px var(--grey); }
.src-SPC, .src-MS { background: var(--fill); color: var(--grey); }
.ok { background: var(--green-tint); color: var(--green-text); }
.warn { background: var(--orange-tint); color: var(--orange-text); }
.bad { background: var(--red-tint); color: var(--red-text); }
.mute { background: var(--fill); color: var(--grey); }

.btn { border-radius: 16px; padding: 10px 20px; font-weight: 600; cursor: pointer; border: 1px solid var(--dark-blue); background: var(--white); color: var(--dark-blue); white-space: nowrap; }
.btn.primary { background: var(--dark-blue); color: var(--white); }
.btn.primary:hover { background: var(--dark-blue-hover); }
.btn.sm { padding: 5px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.ghost { border: 0; background: none; color: var(--dark-blue); padding: 4px 6px; cursor: pointer; }
.ghost:hover { text-decoration: underline; }
.ghost.danger { color: var(--red-text); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--row); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.fchip { background: var(--fill); color: var(--dark-blue); font-size: 13px; border-radius: 4px; padding: 4px 10px; border: 0; cursor: pointer; }
.fchip.on { background: var(--dark-blue); color: var(--white); }
input[type=text], input[type=search], input[type=date], select, textarea { background: var(--fill); border: 1px solid var(--border); border-radius: 6px; padding: 9px 12px; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--bright-blue); outline: none; }
input::placeholder { color: var(--grey); }
.search { flex: 1 1 240px; max-width: 360px; }
.search input { width: 100%; }

.form { display: flex; flex-direction: column; gap: 10px; padding: 16px; background: var(--white); border: 1px solid var(--border); border-radius: 8px; max-width: 560px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--grey); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.err { color: var(--red-text); font-size: 13px; }
.form textarea { min-height: 64px; resize: vertical; }

.queue { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .queue { grid-template-columns: minmax(0, 1fr); } }
.exc { display: grid; grid-template-columns: 3px minmax(0, 1fr); border-bottom: 1px solid var(--row); cursor: pointer; }
.exc:hover, .exc.sel { background: var(--page); }
.exc .stripe.blocking { background: var(--red); } .exc .stripe.warning { background: var(--orange); } .exc .stripe.done { background: var(--border); }
.exc .in { padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.row1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.order { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.order li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; }
.order .rank { color: var(--grey); width: 1.4em; font-variant-numeric: tabular-nums; }
.order .sp { flex: 1; }
.lvl { font-size: 12px; color: var(--grey); text-transform: uppercase; letter-spacing: .06em; }

.bar { display: grid; grid-template-columns: 9em minmax(0, 1fr) 2em; align-items: center; gap: 12px; }
.bar .track { height: 8px; background: var(--fill); border-radius: 4px; overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--dark-blue); }
.chart text { fill: var(--grey); font-size: 11px; font-family: var(--font); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.caption { font-size: 11px; color: var(--grey); }

.gofs { background: var(--yellow); color: #000; border-radius: 16px; padding: 8px 16px; font-weight: 700; text-decoration: none; white-space: nowrap; }
.gofs:hover { background: #f5cd33; }
.fs-strip { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding: 10px 16px; background: #fdf2cc; border: 1px solid var(--yellow); border-radius: 8px; }
.fs { background: #f3f3f3; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.fs-head { background: #004c4c; color: #fff; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.fs-head.fs-fund { align-items: stretch; padding: 24px 32px 28px; }
.fs-head h2 { font-size: 30px; font-weight: 500; line-height: 1.2; max-width: 22ch; }
.fs-search { width: min(380px, 100%); } .fs-search input { width: 100%; background: #fff; border-radius: 8px; }
.fs-body { padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 12px; }
.fs-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.fs-tabs { display: flex; gap: 4px; overflow-x: auto; }
.fs-tabs button { border: 0; background: none; padding: 8px 10px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; color: #000; }
.fs-tabs button.on { border-bottom-color: #004c4c; font-weight: 700; color: #004c4c; }
.fs-pagetabs { background: #fff; padding: 0 24px; border-bottom: 1px solid var(--border); }
.fs-card { background: #fff; border-radius: 8px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; border: 1px solid transparent; }
.fs-card:hover { border-color: #004c4c; }
.fs-card h3 { color: #004c4c; font-size: 20px; font-weight: 500; }
.fs-meta { display: flex; flex-wrap: wrap; gap: 6px 28px; font-size: 12px; color: #4b4b4b; } .fs-meta b { color: #000; font-size: 13px; }
.fs-mod { display: inline-block; background: var(--yellow); color: #000; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; vertical-align: middle; }
.fs-hl { background: #fdf2cc; padding: 0 3px; border-radius: 3px; color: #000; }
.fs-warn { background: #fdf2cc; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
.fs-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.fs-panel { background: #fff; border-radius: 8px; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.fs-panel td { padding: 9px 8px; font-size: 13px; } .fs-panel td:first-child { color: #4b4b4b; }
.fs-doc { padding: 10px 0; border-bottom: 1px solid var(--border); }
.sri { display: flex; gap: 6px; flex-wrap: wrap; } .sri span { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 4px; }
.sri .on { background: #004c4c; color: #fff; border-color: #004c4c; font-weight: 700; }
#fsother { max-width: 280px; background: #fff; }

/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 30; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
  padding: calc(48px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--white); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.12); width: 100%; max-width: 600px; padding: 32px; display: flex; flex-direction: column; gap: 16px; position: relative; }
@media (max-width: 520px) { .modal { padding: 20px; } }
.modal .x { position: absolute; top: 16px; right: 16px; border: 0; background: none; color: var(--grey); font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding-top: 8px; }
.section { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid var(--border); border-radius: 8px; }
.section .sh { display: flex; justify-content: space-between; align-items: center; }
.pick { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--row); }
.pick:last-child { border-bottom: 0; }
.pick input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--dark-blue); }
.pick.disabled { color: var(--grey); }

footer.foot { border-top: 1px solid var(--border); background: var(--white); }
footer.foot .in { max-width: 1248px; margin: 0 auto; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
footer.foot img { height: 20px; width: auto; display: block; }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); background: var(--text); color: var(--white); padding: 12px 16px; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,.12); max-width: min(440px, calc(100vw - 32px)); z-index: 40; }

@media (max-width: 768px) {
  .topbar .in { gap: 8px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .mainnav { order: 3; width: 100%; overflow-x: auto; }
  .mainnav a { padding: 10px 10px; }
  .clientname { display: none; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .card > .bd, .card > .hd, .toolbar { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

function docsTab(s) {
  const all = DOCS[s.id] || [];

  const seen = new Set(); const uniq = []; let dups = 0;

  const groups = ['Commercial', 'Regulatory'];
  return `<div style="padding:24px;display:flex;flex-direction:column;gap:20px">
    ${dups ? `<div class="notice">${dups} duplicate document${dups > 1 ? 's' : ''} received from the provider ${dups > 1 ? 'are' : 'is'} not delivered. Fundscreener shows this duplicate today; see exception EX-1043.</div>` : ''}
    ${groups.map(g => { const list = uniq.filter(d => DOC_TYPES[d.type][1] === g); return `<div><h3 style="margin-bottom:8px">${g} documents <span class="meta">${list.length}</span></h3>
      <div class="tablewrap"><table><thead><tr><th>Document</th><th>Language</th><th>Date</th><th>Source</th></tr></thead><tbody>
      ${list.map(d => `<tr><td>${DOC_TYPES[d.type][0]}</td><td>${d.lang}</td><td class="ts">${fmtDate(d.date)}</td><td>${srcChip(d.src)}</td></tr>`).join('')}
      </tbody></table></div></div>`; }).join('')}
    <span class="caption">Documents are data points too: type, language, date and source, checked for duplicates and staleness. Synthetic list.</span></div>`;
}

function navTab(s) {
  const pts = nav[s.id] ? NAV_DATES.map(dt => ({ dt, r: resolveList(nav[s.id][dt], 'nav.value', state.knownAt) })).filter(p => p.r.chosen) : [];
  if (!pts.length) return `<div class="bd meta" style="padding:24px">No NAV received yet. ${s.origin === 'client' ? 'Client-created funds get NAVs once a provider covers them or the client uploads them.' : 'The first NAV arrives with the next provider run.'}</div>`;
  const vals = pts.map(p => p.r.chosen.c.v); const min = Math.min(...vals), max = Math.max(...vals);
  const W = 680, H = 210, L = 56, R = 16, T = 14, B = 26; const pad = (max - min) * 0.1 || 1;
  const y = v => T + (H - T - B) * (1 - (v - (min - pad)) / ((max + pad) - (min - pad)));
  const x = i => L + (W - L - R) * (pts.length === 1 ? 0 : i / (pts.length - 1));
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.r.chosen.c.v).toFixed(1)}`).join(' ');
  const area = `${x(0)},${H - B} ${line} ${x(pts.length - 1)},${H - B}`;
  const ticks = [min, (min + max) / 2, max]; const last = pts[pts.length - 1];
  const fb = pts.map((p, i) => p.r.fallback ? `<circle cx="${x(i)}" cy="${y(p.r.chosen.c.v)}" r="5" fill="#f3c000"/>` : '').join('');
  const tail = pts.slice(-8).reverse();
  return `<div style="padding:24px;display:flex;flex-direction:column;gap:12px">
    <div class="legend"><span><span class="dot" style="background:var(--dark-blue)"></span>Golden NAV (${s.ccy})</span><span><span class="dot" style="background:var(--orange)"></span>Taken from second-ranked source</span></div>
    <div class="tablewrap"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Golden NAV over time">
      ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#F0F2F5"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t.toFixed(2)}</text>`).join('')}
      <polygon points="${area}" fill="rgba(0,76,76,.1)"/>
      <polyline points="${line}" fill="none" stroke="#004c4c" stroke-width="2"/>
      ${fb}<circle cx="${x(pts.length - 1)}" cy="${y(last.r.chosen.c.v)}" r="4" fill="#004c4c"/>
      <text x="${L}" y="${H - 6}">${fmtDate(pts[0].dt)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtDate(last.dt)}</text>
    </svg></div>
    <span class="caption">Source: golden copy (Morningstar, Provider B by priority) · NAV as of ${fmtDate(last.dt)} · synthetic data</span>
    <div class="tablewrap"><table><thead><tr><th>NAV date</th><th class="num">Golden NAV</th><th>Source</th><th>Received</th><th>Other sources</th></tr></thead><tbody>
    ${tail.map(p => `<tr><td class="ts">${fmtDate(p.dt)}</td><td class="num">${p.r.chosen.c.v.toFixed(2)}</td><td>${srcChip(p.r.chosen.src)}</td><td class="ts">${fmtTs(p.r.chosen.c.rec)}</td>
      <td>${p.r.rows.filter(x => x.status !== 'chosen' && x.c).map(x => `${srcChip(x.src)} <span class="num">${x.c.v.toFixed(2)}</span>${x.status === 'blocked' ? ' <span class="chip bad">blocked</span>' : ''}`).join(' ')}</td></tr>`).join('')}
    </tbody></table></div></div>`;
}

  const vis = visibleEx();

function validateDraft() {

  if (d.fund.name.trim().length < 3) errs.push('Enter a fund name.');
  if (Object.values(FUNDS).some(f => f.name.toLowerCase() === d.fund.name.trim().toLowerCase())) errs.push('A fund with this name is already in the universe.');
  const seen = new Set();
  d.scs.forEach((s, i) => {
    const n = `Share class ${i + 1}`; const isin = s.isin.trim().toUpperCase();
    if (!isinValid(isin)) errs.push(`${n}: the ISIN is not valid. It needs 2 letters, 9 letters or digits, and a correct check digit.`);
    else if (SC.some(x => x.isin === isin) || COVERAGE.some(c => c.isin === isin)) errs.push(`${n}: ${isin} already exists. Use “Add share classes” for share classes a provider covers.`);
    else if (seen.has(isin)) errs.push(`${n}: this ISIN is entered twice.`);
    seen.add(isin);
    if (s.name.trim().length < 3) errs.push(`${n}: enter a share class name.`);
    for (const [k, label, max] of [['ocf', 'ongoing charges', 10], ['mgmt', 'management fee', 5]]) {
      if (s[k] === '') continue; const v = Number(String(s[k]).replace(',', '.'));

    }
  });
  return errs;
}

function addCoverage(isins) {
  state.clock += 2; const t = ACTION_TIME(); const added = [];

    if (!FUNDS[c.fundKey]) FUNDS[c.fundKey] = { ...newFundOf(c.fundKey) };
    const existing = SC.find(s => s.isin === isin);
    if (existing) { existing.removedAt = null; added.push(existing.id); continue; }
    const id = 'sc' + (SC.length + 1);
    const s = { id, fund: c.fundKey, isin, name: c.name, ccy: c.ccy, dist: c.dist, inc: c.inc, sri: c.sri, ocf: c.ocf, mgmt: c.mgmt, entry: c.entry, exit: c.exit, tc: c.tc, perf: c.perf,

    SC.push(s); seedCandidates(s, c.srcs, '2026-11-10', t, t); added.push(id);
  }
  audit.push({ at: t, actor: USER, action: 'universe.add', obj: `${added.length} share class${added.length > 1 ? 'es' : ''}`, details: isins.join(', ') });

}

function parseFor(code, raw) {
  const t = DP[code].type; const s = String(raw).trim();

    if (t === 'int' && (!Number.isInteger(v) || v < 1 || v > 7)) return { err: 'must be a whole number from 1 to 7' };
    if (t === 'pct' && (v < -1 || v > 30)) return { err: 'is outside the allowed range' };
    return { v };
  }
  if (code === 'share_class.sfdr_classification' && !/^Article [689]$/.test(s)) return { err: 'must be Article 6, Article 8 or Article 9' };
  return { v: s };
}

  <span class="actions"><a href="#universe">← Back to Data Management</a><a href="${LIVE_FS}" target="_blank" rel="noopener">Open the test Fundscreener ↗</a></span></div>`;

function viewFs() {
  const q = state.fsQ.toLowerCase(); const [pcode, plabel] = FS_PERIODS.find(p => p[0] === state.fsPeriod) || FS_PERIODS[0];
  const list = activeSC().filter(s => !q || s.isin.toLowerCase().includes(q) || s.name.toLowerCase().includes(q))
    .map(s => ({ s, r: gv(s.id, pcode) })).sort((a, b) => (b.r ? b.r.v : -1e9) - (a.r ? a.r.v : -1e9));
  return `${fsStrip()}
  <div class="fs">
    <div class="fs-head"><div class="fs-search"><input id="fsq" type="search" placeholder="Rechercher par fonds ou ISIN" aria-label="Rechercher par fonds ou ISIN" value="${esc(state.fsQ)}"></div><b style="font-size:18px">Filtres</b></div>
    <div class="fs-body">
      <div class="fs-bar"><span style="font-size:20px">${list.length} Résultats</span>
        <div class="fs-tabs">${FS_PERIODS.map(([c, l]) => `<button data-fsperiod="${c}" class="${c === pcode ? 'on' : ''}">${l}</button>`).join('')}</div></div>
      ${list.map(({ s, r }) => { const n = latestNav(s.id); const sfdr = gv(s.id, 'share_class.sfdr_classification');
        return `<div class="fs-card" data-fsgo="${s.id}" tabindex="0" role="link">
          <h3>${esc(s.name)} ${scChanged(s.id) ? '<span class="fs-mod">Modifié</span>' : ''}${s.origin === 'client' ? ' <span class="fs-mod" style="background:#e5f6f4">Fonds maison</span>' : ''}</h3>
          <div class="fs-meta"><span>ISIN <b>${s.isin}</b></span><span>Dernière date de valeur liquidative <b style="color:#0c7c2c">${n ? frDate(n.date) : '-'}</b></span>
          <span>Rendement ${plabel} <b>${r ? frPct(r.v) : '-'}</b></span><span>SFDR <b ${isChanged(s.id, 'share_class.sfdr_classification') ? 'class="fs-hl"' : ''}>${sfdr ? esc(sfdr.v) : '-'}</b></span>
          <span>NAV <b>${n ? (s.ccy === 'EUR' ? '€ ' : s.ccy + ' ') + frNum(n.chosen.c.v) : '-'}</b></span></div></div>`; }).join('') || '<p>Aucun résultat.</p>'}
    </div>
  </div>`;
}

function viewFsFund(id) {
  const s = scById(id); if (!s) return fsStrip() + '<p>Part inconnue.</p>';
  const n = latestNav(s.id); const f = FUNDS[s.fund];
  const val = (code, fmt) => { const c = gv(s.id, code); const v = c ? (fmt ? fmt(c.v) : esc(c.v)) : '-'; return isChanged(s.id, code) ? `<span class="fs-hl">${v}</span> <span class="fs-mod">Modifié</span>` : v; };
  const pct = v => frNum(v) + '%';
  const others = activeSC().filter(x => x.fund === s.fund && x.id !== s.id);
  let body = '';
  if (state.fsTab === 'perf') {
    const ret = FS_PERIODS.slice(1).map(([c, l]) => [l, gv(s.id, c)]);
    const dates = [...new Set(FS_PERIODS.map(([c]) => gv(s.id, c)).filter(Boolean).map(c => c.eff))];
    body = `<div class="fs-panel"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><h3>Performances</h3><span>${dates.map(d => frDate(d)).join(' / ') || '-'}</span></div>
      ${dates.length > 1 ? '<div class="fs-warn">Les performances ont des dates différentes (exception EX-1046 dans Data Management).</div>' : ''}
      <div class="tablewrap"><table><thead><tr><th></th><th class="num">Début d'année</th>${ret.map(([l]) => `<th class="num">${l}</th>`).join('')}</tr></thead>
      <tbody><tr><td>Fonds</td><td class="num">${val('perf.return_ytd', frPct)}</td>${FS_PERIODS.slice(1).map(([c]) => `<td class="num">${val(c, frPct)}</td>`).join('')}</tr></tbody></table></div>
      <p class="meta">Rendements annualisés au-delà d'un an. Source : golden copy Data Management.</p></div>`;
  } else if (state.fsTab === 'docs') {
    const seen = new Set(); const docs = (DOCS[s.id] || []).filter(d => { const k = d.type + d.lang + d.date; if (seen.has(k)) return false; seen.add(k); return true; });
    const FR = { factsheet: "Fiche d'information", notice: 'Avis aux actionnaires', kid: 'PRIIPs KID', prospectus: 'Prospectus', annual: 'Rapport annuel', semi: 'Rapport semestriel' };
    body = ['Commercial', 'Regulatory'].map(g => { const l = docs.filter(d => DOC_TYPES[d.type][1] === g);
      return `<div class="fs-panel"><h3>Documents ${g === 'Commercial' ? 'commerciaux' : 'réglementaires'} <span class="meta">${l.length} document(s)</span></h3>
        ${l.map(d => `<div class="fs-doc">${FR[d.type]} <span class="meta">${d.lang} · ${frDate(d.date)}</span></div>`).join('') || '<span class="meta">Aucun document.</span>'}</div>`; }).join('');
  } else {
    const sri = gv(s.id, 'share_class.sri');
    body = `<div class="fs-cols"><div style="display:flex;flex-direction:column;gap:16px">
      <div class="fs-panel"><h3>Indicateur de risque</h3><div class="sri">${[1, 2, 3, 4, 5, 6, 7].map(i => `<span class="${sri && +sri.v === i ? 'on' : ''}">${i}</span>`).join('')}</div>
        ${isChanged(s.id, 'share_class.sri') ? '<span class="fs-mod">Modifié</span>' : ''}<p class="meta" style="margin:0">Indicateur synthétique de risque selon PRIIPS.</p></div>
      <div class="fs-panel"><h3>Coût de ce fonds</h3><table><tbody>
        ${[['Coûts d\'entrée', 'fees.entry_cost'], ['Coûts de sortie', 'fees.exit_cost'], ['Frais de gestion et autres frais administratifs et d\'exploitation', 'fees.management_fee'], ['Commissions liées aux résultats', 'fees.performance_fee'], ['Swing pricing', 'fees.swing_pricing'], ['Coûts de transaction', 'fees.transaction_costs']]
          .map(([l, c]) => `<tr><td>${l}</td><td class="num">${val(c, DP[c].type === 'pct' ? pct : null)}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="fs-panel"><h3>Informations générales</h3><table><tbody>
        ${[['Nom du fonds', 'share_class.name'], ['Devise de la part', 'share_class.currency'], ['ISIN', null, s.isin], ['Date de lancement de la part', 'share_class.inception_date', null, frDate], ['Domiciliation', null, f.dom === 'LU' ? 'Luxembourg' : f.dom], ['Forme juridique', null, f.legal],
           ['Nom de la société de gestion', null, 'ABN AMRO Investment Solutions'], ['Dépositaire', 'fund.depositary'], ['Montant minimum d\'investissement', 'share_class.minimum_investment'], ['Heure limite de passage d\'ordres', 'share_class.order_cutoff'],
           ['Nom de l\'indice de référence', 'share_class.benchmark_name'], ['Période de détention recommandée', 'share_class.recommended_holding_period'], ['Fréquence de calcul de la valeur liquidative', 'share_class.nav_frequency']]
          .map(([l, c, fixed, fmt]) => `<tr><td>${l}</td><td>${c ? val(c, fmt) : esc(fixed)}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  return `${fsStrip()}
  <div class="fs">
    <div class="fs-head fs-fund"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><a href="#fs" style="color:#fff">‹ Retour</a>
      ${others.length ? `<select id="fsother" aria-label="Voir les autres parts"><option value="">Voir les autres parts</option>${others.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select>` : ''}</div>
      <h2>${esc(s.name)}</h2>
      <div class="fs-meta" style="color:#fff"><span>NAV <b style="color:#fff">${n ? s.ccy + ' ' + frNum(n.chosen.c.v) + ' • ' + frDate(n.date) : '-'}</b></span><span>ISIN <b style="color:#fff">${s.isin}</b></span>
        <span>SFDR <b style="color:#fff">${val('share_class.sfdr_classification')}</b></span><span>Catégorie <b style="color:#fff">${val('share_class.provider_category')}</b></span></div></div>
    <div class="fs-tabs fs-pagetabs">${[['char', 'Caractéristiques'], ['perf', 'Performances'], ['docs', 'Documents']].map(([k, l]) => `<button data-fstab="${k}" class="${state.fsTab === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="fs-body">${body}</div>
  </div>`;
}

function fsClick(e) {
  const el = e.target.closest('[data-own],[data-dp],[data-savedp],[data-fsperiod],[data-fsgo],[data-fstab]'); if (!el || el.disabled) return false;
  const ds = el.dataset;
  if (ds.own) {
    const [code, how] = ds.own.split('|'); state.clock += 2; const t = ACTION_TIME();
    (rules.dp[code] ||= []).push({ order: how === 'take' ? [...IN_HOUSE] : [...latest(rules.global, NOW).order], from: t, by: USER });
    audit.push({ at: t, actor: USER, action: how === 'take' ? 'datapoint.take_in_house' : 'datapoint.hand_back', obj: code, details: how === 'take' ? 'AAIS leads; Morningstar is fallback' : 'Morningstar leads again' });
    toast(how === 'take' ? `${DP[code].label} is now managed in-house by AAIS. Enter AAIS values where they differ.` : `${DP[code].label} handed back to Morningstar.`);
    if (how === 'take') state.dpSel = code; render(); return true;
  }
  if (ds.savedp !== undefined) {
    const code = ds.savedp; const inputs = [...document.querySelectorAll('[data-dpin]')]; const errs = []; const changes = [];
    for (const i of inputs) {
      const sc = i.dataset.dpin; const cur = versionAt(cand[sc][code] || [], 'CLIENT', NOW); const raw = i.value.trim();
      if (raw === '' || (cur && String(cur.v) === raw)) continue;
      const p = parseFor(code, raw); if (p.err) { errs.push(`${scById(sc).isin}: “${esc(raw)}” ${p.err}.`); continue; }
      changes.push([sc, p.v]);
    }
    if (errs.length) { state.dpErr = errs.join('<br>'); render(); return true; }
    state.dpErr = ''; if (!changes.length) { toast('No changes to save.'); return true; }
    state.clock += 2; const t = ACTION_TIME();
    changes.forEach(([sc, v]) => { cand[sc][code].push({ src: 'CLIENT', v, eff: '2026-11-10', rec: t, by: USER, reason: 'Entered in Data points by AAIS' }); state.changed.add(sc + '|' + code); });
    audit.push({ at: t, actor: USER, action: 'value.update', obj: code, details: `${changes.length} share class${changes.length > 1 ? 'es' : ''} · source AAIS` });
    toast(`${changes.length} value${changes.length > 1 ? 's' : ''} saved as source AAIS. Open “Go to Fundscreener” to see the result.`); render(); return true;
  }
  if (ds.dp !== undefined) { state.dpSel = ds.dp || null; state.dpErr = ''; if (state.route !== 'datapoints') location.hash = 'datapoints'; else render(); return true; }
  if (ds.fsperiod) { state.fsPeriod = ds.fsperiod; render(); return true; }
  if (ds.fstab) { state.fsTab = ds.fstab; render(); return true; }
  if (ds.fsgo) { state.fsTab = 'char'; location.hash = 'fs-' + ds.fsgo; return true; }
  return false;
}

// ---------- render + routing ----------
function render() {
  const r = state.route;
  const views = { universe: viewUniverse, datapoints: viewDatapoints, fs: viewFs, overview: viewOverview, exceptions: viewExceptions, rules: viewRules, sources: viewSources, delivery: viewDelivery, audit: viewAudit, catalogue: viewCatalogue };
  const main = document.getElementById('main');
  const focusId = document.activeElement && main.contains(document.activeElement) ? document.activeElement.id : null;
  main.innerHTML = r.startsWith('sc-') ? viewShareClass(r.slice(3)) : r.startsWith('fs-') ? viewFsFund(r.slice(3)) : (views[r] || viewUniverse)();
  if (focusId === 'q' || focusId === 'fsq') { const q = document.getElementById(focusId); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  renderNav(); renderModal();
}
function route() {
  const h = location.hash.replace('#', '') || 'universe';
  if (h !== state.route) { state.route = h; state.formErr = ''; state.editOrder = null; state.confirmRemove = null; if (!h.startsWith('sc-')) state.open.clear(); }
  render();
}
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });

let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3600); }
function log(action, obj, details) { state.clock += 3; audit.push({ at: ACTION_TIME(), actor: USER, action, obj, details }); }
function closeModal() { state.modal = null; state.modalErr = ''; renderModal(); }

document.getElementById('knownat').addEventListener('change', e => { state.knownAt = e.target.value; state.editOrder = null; state.confirmRemove = null; closeModal(); render(); });

const main = document.getElementById('main');
main.addEventListener('input', e => { if (e.target.id === 'q') { state.q = e.target.value; render(); } if (e.target.id === 'fsq') { state.fsQ = e.target.value; render(); } });
main.addEventListener('change', e => { if (e.target.id === 'fsother' && e.target.value) { state.fsTab = 'char'; location.hash = 'fs-' + e.target.value; } });
main.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.fsgo) e.target.click(); });
main.addEventListener('click', e => {
  if (fsClick(e)) return;
  const el =e.target.closest('[data-go],[data-toggle],[data-tab],[data-sel],[data-ex],[data-move],[data-rule],[data-filter],[data-remove],[data-doremove],[data-cancelremove],[data-restore],[data-open]');
  if (!el || el.disabled) return;
  const ds = el.dataset;
  if (ds.remove) { e.stopPropagation(); state.confirmRemove = ds.remove; render(); return; }
  if (ds.cancelremove) { state.confirmRemove = null; render(); return; }
  if (ds.doremove) { const s = scById(ds.doremove); state.clock += 2; s.removedAt = ACTION_TIME(); state.confirmRemove = null;
    audit.push({ at: s.removedAt, actor: USER, action: 'universe.remove', obj: s.isin, details: s.name + ' · collection and delivery stopped, history kept' });
    toast(`${s.name} removed from the universe. History kept; you can restore it from “Removed”.`); render(); return; }
  if (ds.restore) { e.stopPropagation(); const s = scById(ds.restore); s.removedAt = null; log('universe.restore', s.isin, s.name); toast(`${s.name} is back in the universe.`); render(); return; }
  if (ds.open) { state.modal = ds.open; state.modalErr = ''; if (ds.open === 'add') { state.pick = new Set(); state.pickQ = ''; } if (ds.open === 'create') state.draft = { fund: { name: '', legal: 'FGR', dom: 'NL', sfdr: 'Article 8' }, scs: [blankSC()] }; renderModal(); const f = document.querySelector('.modal input'); if (f) f.focus(); return; }
  if (ds.filter) { state.filter = ds.filter; render(); return; }
  if (ds.go) { location.hash = ds.go; return; }
  if (ds.toggle) { const k = ds.toggle; state.open.has(k) ? state.open.delete(k) : state.open.add(k); state.formErr = ''; render(); return; }
  if (ds.tab) { state.tab = ds.tab; render(); return; }
  if (ds.sel) { state.sel = ds.sel; state.formErr = ''; render(); return; }
  if (ds.ex) {
    const x = exceptions.find(z => z.id === state.sel) || visibleEx()[0]; if (!x) return;
    const list = x.dp === 'nav.value' ? nav[x.sc][x.eff] : x.sc && x.dp ? cand[x.sc][x.dp] : [];
    const b = list.find(c => c.blocked); const a = ds.ex;
    if (a === 'adduniverse') { addCoverage([x.isin]); toast('Added to the universe. Values arrive with the next provider run.'); render(); return; }
    if (a === 'accept' && b) { b.blocked = null; x.status = 'resolved'; x.resolution = `${PROVIDERS[b.src].short} value accepted by ${USER}`; }
    if (a === 'keep') { x.status = 'resolved'; x.resolution = `Value stays excluded (decided by ${USER})`; }
    if (a === 'confirm') { x.status = 'resolved'; x.resolution = `Golden value confirmed by ${USER}`; }
    if (a === 'ignore') { x.status = 'ignored'; x.resolution = `Ignored by ${USER}`; }
    log('exception.' + (a === 'ignore' ? 'ignore' : 'resolve'), x.id, x.resolution);
    toast(`${x.id} ${x.status}. Golden copy recomputed.`);
    const next = exceptions.find(z => z.status === 'open'); if (next) state.sel = next.id;
    render(); return;
  }
  if (ds.move) { const [, i, dir] = ds.move.split('|'); const o = state.editOrder.order; const j = +i + +dir; [o[+i], o[j]] = [o[j], o[+i]]; render(); return; }
  if (ds.rule) {
    const [a, dp] = ds.rule.split('|');
    if (a === 'edit') state.editOrder = { dp, order: [...latest(rules.dp[dp], state.knownAt).order], isNew: false };
    if (a === 'cancel') { if (state.editOrder.isNew) delete rules.dp[state.editOrder.dp]; state.editOrder = null; }
    if (a === 'add') { const d = document.getElementById('newdp').value; state.clock += 1; rules.dp[d] = [{ order: [...latest(rules.global, NOW).order], from: ACTION_TIME(), by: USER }]; state.editOrder = { dp: d, order: [...rules.dp[d][0].order], isNew: true }; }
    if (a === 'save') {
      const { dp: d, order, isNew } = state.editOrder; log('override.create', d, order.map(s => PROVIDERS[s].short).join(' > '));
      if (isNew) rules.dp[d][0] = { order: [...order], from: ACTION_TIME(), by: USER }; else rules.dp[d].push({ order: [...order], from: ACTION_TIME(), by: USER });
      state.editOrder = null; toast(`Override saved for ${DP[d].label}. Applies from ${ACTION_TIME().slice(11)} today.`);
    }
    render();
  }
});
main.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.sel) e.target.click(); });
main.addEventListener('submit', e => {
  const f = e.target.closest('form[data-correct]'); if (!f) return; e.preventDefault();
  const [sc, dp, exId] = f.dataset.correct.split('|'); const raw = f.elements.v.value.trim().replace(',', '.'); const reason = f.elements.r.value.trim();
  const t = DP[dp].type; let v = raw;
  if (!raw) { state.formErr = 'Enter a value.'; render(); return; }
  if (t === 'pct' || t === 'int') { v = Number(raw); if (!isFinite(v)) { state.formErr = 'Enter a number, for example 1.45.'; render(); return; } }
  if (t === 'int' && (v < 1 || v > 7 || !Number.isInteger(v))) { state.formErr = 'The SRI is a whole number from 1 to 7.'; render(); return; }
  if (reason.length < 5) { state.formErr = 'Give a reason, for example the document and its date.'; render(); return; }
  log('correction.create', `${scById(sc).isin} · ${dp}`, `${t === 'pct' ? v.toFixed(2) + ' %' : v} · ${reason}`);
  cand[sc][dp].push({ src: 'MANUAL', v, eff: '2026-11-10', rec: ACTION_TIME(), by: USER, reason });
  if (exId) { const x = exceptions.find(z => z.id === exId); if (x) { x.status = 'resolved'; x.resolution = `Manual correction by ${USER}: ${reason}`; } }
  state.changed.add(sc + '|' + dp);
  state.formErr = ''; toast('Correction added as source “Manual”. Provider values unchanged.'); render();
});

// modal events
const modalEl = document.getElementById('modal');
modalEl.addEventListener('click', e => {
  const el = e.target.closest('[data-close],[data-addpicked],[data-addsc],[data-delsc],[data-createfund]');
  if (!el || el.disabled) return;
  if (el.dataset.close && (e.target === el || el.tagName === 'BUTTON')) { closeModal(); return; }
  if (el.dataset.addpicked) {
    const added = addCoverage([...state.pick]); state.flash = added; state.filter = 'all'; state.q = ''; closeModal();
    toast(`${added.length} share class${added.length > 1 ? 'es' : ''} added. Values arrive with the next provider run.`);
    if (state.route !== 'universe') location.hash = 'universe'; else render(); return;
  }
  if (el.dataset.addsc) { state.draft.scs.push(blankSC()); renderModal(); return; }
  if (el.dataset.delsc) { state.draft.scs.splice(+el.dataset.delsc, 1); renderModal(); return; }
  if (el.dataset.createfund) {
    const errs = validateDraft(); if (errs.length) { state.modalErr = errs.map(esc).join('<br>'); renderModal(); return; }
    const d = state.draft; const fk = 'F' + (Object.keys(FUNDS).length + 1); state.clock += 2; const t = ACTION_TIME();
    FUNDS[fk] = { name: d.fund.name.trim(), legal: d.fund.legal, dom: d.fund.dom, sfdr: d.fund.sfdr, origin: 'client' };
    const ids = d.scs.map(x => {
      const id = 'sc' + (SC.length + 1); const num = v => v === '' ? '' : Number(String(v).replace(',', '.'));
      const s = { id, fund: fk, isin: x.isin.trim().toUpperCase(), name: x.name.trim(), ccy: x.ccy, dist: x.dist, inc: x.inc, ocf: num(x.ocf), mgmt: num(x.mgmt), origin: 'client', addedAt: t, addedBy: USER, removedAt: null };
      SC.push(s); seedCandidates(s, ['CLIENT'], x.inc || '2026-11-10', t, t); return id;
    });
    audit.push({ at: t, actor: USER, action: 'fund.create', obj: FUNDS[fk].name, details: `${LEGAL[d.fund.legal]} · ${ids.length} share class${ids.length > 1 ? 'es' : ''} · source Client entry` });
    state.flash = ids; state.filter = 'all'; state.q = ''; closeModal();
    toast(`${FUNDS[fk].name} created with ${ids.length} share class${ids.length > 1 ? 'es' : ''}. Values stored as source AAIS.`);
    if (state.route !== 'universe') location.hash = 'universe'; else render();
  }
});
modalEl.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'pickq') { state.pickQ = t.value; renderModal(); const p = document.getElementById('pickq'); p.focus(); p.setSelectionRange(p.value.length, p.value.length); return; }
  if (t.dataset.pick) { t.checked ? state.pick.add(t.dataset.pick) : state.pick.delete(t.dataset.pick); const b = modalEl.querySelector('[data-addpicked]'); const n = state.pick.size; b.disabled = !n; b.textContent = `Add ${n || ''} share class${n === 1 ? '' : 'es'}`; return; }
  if (t.dataset.f) { const [a, b, c] = t.dataset.f.split('.'); if (a === 'fund') state.draft.fund[b] = t.value; else state.draft.scs[+b][c] = t.value; }
});
modalEl.addEventListener('change', e => { const t = e.target; if (t.dataset.f && t.tagName === 'SELECT') { const [a, b, c] = t.dataset.f.split('.'); if (a === 'fund') state.draft.fund[b] = t.value; else state.draft.scs[+b][c] = t.value; } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.modal) closeModal(); });

route();
})();
</script>
